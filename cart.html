<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-black text-white">
    <nav class="flex justify-between p-8 border-b border-gray-800">
        <h1 class="text-2xl font-bold text-yellow-600">TARA</h1>
        <div class="space-x-6">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="cart.html" class="text-yellow-600">Cart</a>
        </div>
    </nav>

    <div class="max-w-xl mx-auto mt-20 p-8 bg-zinc-900 rounded-lg">
        <h2 class="text-3xl mb-8 italic text-center">Your Selection</h2>
        <div id="cart-list" class="space-y-4"></div>
        <div class="border-t border-gray-700 mt-8 pt-4 flex justify-between text-xl">
            <span>Total Amount:</span>
            <span id="total-price" class="text-yellow-500">$0</span>
        </div>
        <button class="w-full bg-yellow-600 text-black font-bold py-4 mt-8 hover:bg-yellow-500 transition">COMPLETE RESERVATION</button>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem('tara_cart')) || [];
        const list = document.getElementById('cart-list');
        let total = 0;

        if(cart.length === 0) {
            list.innerHTML = "<p class='text-gray-500 text-center'>Your cart is currently empty.</p>";
        } else {
            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = "flex justify-between border-b border-gray-800 pb-2";
                div.innerHTML = `<span>${item.name}</span><span>$${item.price}</span>`;
                list.appendChild(div);
                total += item.price;
            });
            document.getElementById('total-price').innerText = `$${total}`;
        }
    </script>
</body>
</html>
